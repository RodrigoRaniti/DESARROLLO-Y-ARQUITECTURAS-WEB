<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Raniti Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title" id="dynamicTitle">HOLA</h1>
        </div>

        <div class="form-container">
            <form id="mainForm">
                <div class="form-grid">

                    <div class="field-group">
                        <label for="nombreCompleto">Nombre Completo</label>
                        <input type="text" id="nombreCompleto" name="nombreCompleto" placeholder="Ingresa tu nombre completo">
                        <div class="error-message" id="error-nombreCompleto"></div>
                    </div>

                    <div class="field-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                        <div class="error-message" id="error-email"></div>
                    </div>

                    <div class="field-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Contraseña">
                        <div class="error-message" id="error-password"></div>
                    </div>

                    <div class="field-group">
                        <label for="repetirPassword">Repetir Contraseña</label>
                        <input type="password" id="repetirPassword" name="repetirPassword" placeholder="Repetir contraseña">
                        <div class="error-message" id="error-repetirPassword"></div>
                    </div>

                    <div class="field-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" placeholder="Edad">
                        <div class="error-message" id="error-edad"></div>
                    </div>

                    <div class="field-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" name="telefono" placeholder="Telefono sin espacios">
                        <div class="error-message" id="error-telefono"></div>
                    </div>

                    <div class="field-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Calle y numero">
                        <div class="error-message" id="error-direccion"></div>
                    </div>

                    <div class="field-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad">
                        <div class="error-message" id="error-ciudad"></div>
                    </div>

                    <div class="field-group">
                        <label for="codigoPostal">Código Postal</label>
                        <input type="text" id="codigoPostal" name="codigoPostal" placeholder="Codigo postal">
                        <div class="error-message" id="error-codigoPostal"></div>
                    </div>

                    <div class="field-group">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="DNI">
                        <div class="error-message" id="error-dni"></div>
                    </div>

                    <div class="submit-container">
                        <button type="submit" class="submit-btn">Enviar</button>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
